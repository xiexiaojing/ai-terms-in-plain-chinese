schema: spec-driven

context: |
  本机私活：公众号文章语义检索（「写过没有」）。不进公司 git，不占 REQ 号。
  用法与数据来源见 README.md，那是唯一真相。
  数据是只读引用 wechat-article/ 与 feishu-claude-bot/data/，本仓不改它们一个字。
  平凡改动（调权重、改文案、修样式）直接做；改语料来源、换嵌入模型、改链接匹配判据
  这类会影响检索结果可信度的，才走 changes/ 提案。

# Project context (optional)
